<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f2942">
    <meta name="description" content="Sistem E-Voting OSIS Candra Kirana SPENASIX Divisi 9 - Otomatis menuju halaman Voting ID Card / QR.">
    <meta name="robots" content="noindex">
    <title>Menyiapkan Voting... &bull; E-Voting OSIS SPENASIX Divisi 9</title>

    <!-- Prefetch halaman tujuan agar terasa instan, terutama di HP kelas bawah -->
    <link rel="prefetch" href="vote.html">
    <link rel="prefetch" href="css/style.css">
    <link rel="prefetch" href="css/vote.css">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://unpkg.com">

    <!-- Fallback bila JavaScript dimatikan: langsung lompat ke halaman voting -->
    <noscript><meta http-equiv="refresh" content="0; url=vote.html"></noscript>

    <style>
        /* ================================================================
           SPLASH LOADING SCREEN (Ringan: tanpa gambar & tanpa library.
           Hanya animasi transform/opacity agar aman di HP kelas bawah.)
           ================================================================ */
        :root {
            --navy: #0f2942;
            --navy-mid: #16386b;
            --navy-light: #1e3a8a;
            --gold: #d97706;
            --gold-light: #fbbf24;
            --splash-ms: 1600ms;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(165deg, var(--navy) 0%, var(--navy-mid) 58%, var(--navy-light) 100%);
            -webkit-font-smoothing: antialiased;
        }

        .splash {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-badge {
            font-size: 0.66rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 700;
            color: #fde68a;
            background: rgba(217, 119, 6, 0.18);
            border: 1px solid rgba(217, 119, 6, 0.55);
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1.6rem;
        }

        /* --- Logo + Cincin Putar --- */
        .logo-wrap {
            position: relative;
            width: 104px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.35rem;
            animation: splashPop 0.45s ease-out both;
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--gold-light);
            border-right-color: var(--gold-light);
            animation: splashSpin 0.95s linear infinite;
        }

        .logo-core {
            width: 76px;
            height: 76px;
            border-radius: 20px;
            background: #ffffff;
            color: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.85rem;
            letter-spacing: -0.02em;
            border: 2px solid var(--gold);
        }

        /* --- Teks Identitas --- */
        .splash-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .splash-sub {
            margin-top: 0.3rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c7d2e4;
        }

        /* --- Progress Bar --- */
        .splash-bar {
            position: relative;
            width: 100%;
            max-width: 250px;
            height: 6px;
            margin-top: 1.6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            overflow: hidden;
        }

        .splash-bar-fill {
            display: block;
            height: 100%;
            width: 100%;
            border-radius: 999px;
            transform-origin: left center;
            transform: scaleX(0);
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            animation: splashFill var(--splash-ms) cubic-bezier(0.35, 0, 0.25, 1) forwards;
        }

        .splash-status {
            margin-top: 0.9rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            min-height: 1.25em;
        }

        /* --- Tombol Cadangan (muncul setelah beberapa saat) --- */
        .splash-actions {
            margin-top: 1.5rem;
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .splash-actions.is-ready {
            opacity: 1;
            visibility: visible;
        }

        .splash-btn {
            display: block;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: #ffffff;
            color: var(--navy);
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            border: 2px solid var(--gold-light);
        }

        .splash-btn:active { transform: scale(0.98); }

        .splash-link {
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
            text-decoration: underline;
        }

        /* --- Keyframes --- */
        @keyframes splashSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes splashPop {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes splashFill {
            to { transform: scaleX(1); }
        }

        /* Hormati preferensi pengguna yang mematikan animasi */
        @media (prefers-reduced-motion: reduce) {
            .logo-ring { animation: none; }
            .logo-wrap { animation: none; }
            .splash-bar-fill { animation-duration: 600ms; }
        }
    </style>

    <!-- Set durasi splash sedini mungkin agar progress bar sinkron dengan redirect -->
    <script>
        (function () {
            var seen = false;
            try { seen = sessionStorage.getItem('evoting_splash_seen') === '1'; } catch (e) { }
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Kunjungan pertama dalam tab: 1.6s. Kunjungan berikutnya: 0.5s (hemat waktu di HP kentang).
            var delay = seen ? 500 : (reduced ? 800 : 1600);

            window.__splashDelay = delay;
            document.documentElement.style.setProperty('--splash-ms', delay + 'ms');
        })();
    </script>
</head>
<body>

    <main class="splash" role="status" aria-live="polite">
        <span class="splash-badge">Sistem E-Voting Resmi</span>

        <div class="logo-wrap">
            <span class="logo-ring" aria-hidden="true"></span>
            <span class="logo-core">CK</span>
        </div>

        <h1 class="splash-title">OSIS Candra Kirana</h1>
        <p class="splash-sub">SPENASIX &bull; Divisi 9</p>

        <div class="splash-bar" aria-hidden="true">
            <span class="splash-bar-fill"></span>
        </div>
        <p class="splash-status" id="splashStatus">Menyiapkan halaman voting&hellip;</p>

        <div class="splash-actions" id="splashActions">
            <a class="splash-btn" href="vote.html">Buka Voting ID Card Sekarang &rarr;</a>
            <a class="splash-link" href="portal.html">Masuk Menu Bilik / Panitia</a>
        </div>
    </main>

    <script>
        (function () {
            var delay = window.__splashDelay || 1600;
            var statusEl = document.getElementById('splashStatus');
            var actionsEl = document.getElementById('splashActions');
            var redirected = false;

            function goToVoting() {
                if (redirected) return;
                redirected = true;
                try { sessionStorage.setItem('evoting_splash_seen', '1'); } catch (e) { }
                window.location.replace('vote.html');
            }

            // Tahapan teks status agar pengguna tahu prosesnya tetap berjalan
            var steps = [
                { at: Math.round(delay * 0.45), text: 'Menyiapkan pemindai QR Code\u2026' },
                { at: Math.round(delay * 0.78), text: 'Hampir siap\u2026' }
            ];
            steps.forEach(function (step) {
                if (step.at > 0) {
                    setTimeout(function () {
                        if (!redirected && statusEl) statusEl.textContent = step.text;
                    }, step.at);
                }
            });

            // Tombol cadangan muncul bila pengguna ingin langsung melompat
            setTimeout(function () {
                if (actionsEl) actionsEl.classList.add('is-ready');
            }, Math.max(900, Math.round(delay * 0.6)));

            // Redirect utama + failsafe (bila timer ditunda oleh browser HP)
            setTimeout(goToVoting, delay);
            setTimeout(goToVoting, delay + 2500);
        })();
    </script>

</body>
</html>
